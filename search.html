<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container header-box">
            <div>
                <h1>Library Management System</h1>
                <p>Search Results</p>
            </div>
            <a class="home-link" href="/">Dashboard</a>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <div class="panel-heading">
                <h2>Search: "{{ keyword }}"</h2>
            </div>

            <form class="search-form" action="/search" method="get">
                <input type="text" name="q" value="{{ keyword }}" placeholder="Search book">
                <button type="submit">Search</button>
            </form>

            <div class="table-wrap">
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Available</th>
                    </tr>
                    {% for book in books %}
                    <tr>
                        <td>{{ book.id }}</td>
                        <td>{{ book.title }}</td>
                        <td>{{ book.author }}</td>
                        <td>{{ book.category }}</td>
                        <td>{{ book.available }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="empty">No matching book found.</td></tr>
                    {% endfor %}
                </table>
            </div>
        </section>
    </main>
</body>
</html>
